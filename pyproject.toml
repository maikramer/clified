[project]
name = "clified"
version = "0.2.0"
description = "Instalador universal e biblioteca CLI para ferramentas Python, Rust e Bun"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Maikeu Locatelli" }]
keywords = ["installer", "cli", "python", "rust", "devtools"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Build Tools",
]
dependencies = [
    "rich>=13",
    "pyyaml>=6",
    "pydantic>=2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
]

[project.scripts]
clified-install = "clified.installer.unified:main"

[project.urls]
Homepage = "https://github.com/maikramer/clified"
Repository = "https://github.com/maikramer/clified"
Issues = "https://github.com/maikramer/clified/issues"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/clified"]

[tool.hatch.build.targets.sdist]
include = [
    "/src/clified",
    "/config",
    "/install.sh",
    "/install.ps1",
    "/install.bat",
    "/tools.yaml.example",
    "/LICENSE",
    "/README.md",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.coverage.run]
source = ["clified"]
omit = ["tests/*"]
