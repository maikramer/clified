name: Publish PyPI

on:
  release:
    types: [published]
  workflow_dispatch:

concurrency:
  group: pypi-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install build and test deps
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Ruff lint
        continue-on-error: true
        run: ruff check src tests

      - name: Ruff format
        continue-on-error: true
        run: ruff format --check src tests

      - name: Run tests
        run: pytest -q

      - name: Build package
        run: pip install hatch && hatch build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/
